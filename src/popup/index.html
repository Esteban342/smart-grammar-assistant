<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración - Smart Assistant</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="header">
      <h2>Smart Assistant</h2>
    </div>

    <div class="form-group">
      <label for="apiKey">Gemini API Key</label>
      <div class="input-wrapper">
        <input type="password" id="apiKey" placeholder="AIzaSy..." autocomplete="off" />
        <button id="saveBtn">Guardar</button>
      </div>
    </div>

    <div id="status" class="status-badge">
      <span>Configura tu API Key para comenzar</span>
    </div>

    <div class="info-box">
      <strong>Asistente activo:</strong> Selecciona texto en cualquier página para corregir o humanizar tus textos.
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
